# OpenAI Codex 配置

model: o3
sandbox: true

instructions: |
  This project uses devflow v3.0 phased workflow.
  
  ## Core Rules
  - Read `.devflow/state.json` for current phase
  - Respect gate checks — do not skip phases
  - Load memory from `.devflow/memory/`
  - Record decisions in `.devflow/memory/DECISIONS.md`
  - Record lessons in `.devflow/memory/LESSONS.md`
  
  ## Phase Gates (artifacts under `.devflow/<req-id>/`)
  - Phase 0: 00-strategy.md (G0)
  - Phase 1: 01-analysis.md (G1; plus manual gate G2)
  - Phase 1.5: 01b-context.md (G2.5)
  - Phase 2: 02-design.md (G3)
  - Phase 2.5: 02a-variants.md (G3.5)
  - Phase 3: 03-tasks.md (G4, strict mode only)
  - Phase 4: 04-wave-logs.md (G5)
  - Phase 5: 05-test-report.md (G6)
  - Phase 6: 06-review.md (G7)
  - Phase 7: 07-canary.md (G7.5)
  - Phase 8: 08-archive.md (G8)
  - Mode trimming: fast starts at 04-wave-logs.md; lean starts at 02-design.md;
    no 03-tasks.md unless strict

hooks:
  pre_prompt:
    - command: "node $DEVFLOW_HOME/adapters/shared/core-bridge.js read-state ."
      description: "Load current devflow phase state"
